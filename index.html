<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Resume Analyzer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>📄 AI Resume Analyzer</h1>
  <div class="sub">Paste your resume and a job description to get a match score, missing skills and improvement tips.</div>
</header>
<main>
  <section class="card">
    <h2>⚙️ Settings</h2>
    <div class="grid">
      <div><label for="key">Gemini API key (stored only in your browser)</label><input id="key" type="password" autocomplete="off" placeholder="Paste your key from aistudio.google.com"></div>
      <div><label for="model">Model</label><input id="model" value="gemini-2.5-flash"></div>
    </div>
    <div class="bar"><button id="saveKey" type="button" class="ghost">Save settings</button></div>
  </section>

  <section class="grid">
    <div class="card"><label for="resume">Your resume (text)</label><textarea id="resume" placeholder="Paste your resume text here…"></textarea>
      <div style="margin-top:8px"><input type="file" id="file" accept=".txt" aria-label="Load a .txt resume"> <span class="note">optional .txt</span></div></div>
    <div class="card"><label for="jd">Job description</label><textarea id="jd" placeholder="Paste the job description here…"></textarea></div>
  </section>
  <div class="bar">
    <button id="go" type="button">Analyze resume</button>
    <button id="demo" type="button" class="ghost">Load sample data</button>
    <button id="clear" type="button" class="ghost">Clear</button>
  </div>
  <div class="err" id="err" role="alert"></div>
  <section id="res" hidden></section>
  <p class="note">Privacy: your text is sent to Google’s Gemini API only when you click Analyze. The score is an AI estimate for guidance, not an official ATS result.</p>
</main>
<script src="app.js"></script>
</body>
</html>
